<script>
  // Catches ANY error (even before React/Firebase load) and shows it
  // on screen instead of silently failing. This is a debugging aid —
  // safe to leave in.
  function showFatal(msg) {
    var el = document.getElementById("fatal-banner");
    el.style.display = "block";
    el.textContent = (el.textContent ? el.textContent + "\n\n" : "") + msg;
  }
  window.showFatal = showFatal;
  window.addEventListener("error", function (e) {
    showFatal("Error: " + (e.message || e.type) + (e.filename ? ("\n" + e.filename + ":" + e.lineno) : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    var reason = e.reason;
    var msg = (reason && (reason.message || reason.code)) ? (reason.code ? reason.code + " — " + reason.message : reason.message) : String(reason);
    showFatal("Unhandled promise rejection: " + msg);
  });
</script>

    function collection(dbRef, name) { return dbRef.collection(name); }
    function doc(dbRef, collName, docId) { return dbRef.collection(collName).doc(docId); }
    function orderBy(field) { return { type: "orderBy", field: field }; }
    function query(collRef, constraint) {
      return constraint && constraint.type === "orderBy" ? collRef.orderBy(constraint.field) : collRef;
    }
    function onSnapshot(ref, onNext, onError) { return ref.onSnapshot(onNext, onError); }
    async function getDoc(docRef) {
      const snap = await docRef.get();
      return { exists: () => snap.exists, data: () => snap.data(), id: snap.id };
    }
    async function getDocs(collRef) { return collRef.get(); }
    async function addDoc(collRef, data) { return collRef.add(data); }
    async function updateDoc(docRef, data) { return docRef.update(data); }

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

// ---------- ministry (multi-instance) config ----------
// Add an entry here for each group using this app. The `key` is what goes
// in the URL as ?org=key — e.g. yoursite.pages.dev/?org=kids
// Each key gets its own volunteers, shifts, and admin passcode, all inside
// the same Firebase project — nothing else to duplicate or maintain twice.
const MINISTRIES = {
  students: { label: "Calvary Students" },
  kids: { label: "Calvary Kids" },
};
const DEFAULT_MINISTRY = "students";

function getMinistryKey() {
  const params = new URLSearchParams(window.location.search);
  const key = params.get("org");
  return (key && MINISTRIES[key]) ? key : DEFAULT_MINISTRY;
}
function getMinistryLabel(key) {
  return MINISTRIES[key]?.label || key;
}

// ---------- helpers ----------
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); rows.push(row); row = []; field = "";
      } else field += c;
    }
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(cell => cell.trim() !== ""));
}
function lastNameOf(fullName) {
  const parts = (fullName || "").trim().split(/\s+/);
  return parts[parts.length - 1] || "";
}
function fmtDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}
function fmtTime(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  const period = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return m === 0 ? `${h12} ${period}` : `${h12}:${String(m).padStart(2,"0")} ${period}`;
}
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function addDaysISO(iso, days) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + days);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
}
function toISO(dt) {
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
}
const WEEKDAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function ordinal(n) {
  if (n === "last") return "last";
  const s = ["th","st","nd","rd"];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
// Given a date, figure out its "position" within its month for recurrence purposes —
// e.g. Aug 3, 2026 (a Monday) is the 1st Monday of August. If it's the last occurrence
// of that weekday in its month, prefer "last" so recurrence doesn't skip shorter months.
function computeNthWeekday(dateISO) {
  const [y, m, d] = dateISO.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const weekday = dt.getDay();
  const nthNum = Math.ceil(d / 7);
  const next = new Date(y, m - 1, d + 7);
  const isLast = next.getMonth() !== (m - 1);
  return { weekday, nth: isLast ? "last" : nthNum };
}
// Find the date of the nth (or "last") occurrence of a weekday within a given month.
// Returns null if that nth occurrence doesn't exist in this particular month.
function nthWeekdayOfMonth(year, monthIndex, weekday, nth) {
  if (nth === "last") {
    const lastOfMonth = new Date(year, monthIndex + 1, 0);
    let day = lastOfMonth.getDate();
    while (new Date(year, monthIndex, day).getDay() !== weekday) day--;
    return new Date(year, monthIndex, day);
  }
  const first = new Date(year, monthIndex, 1);
  const offset = (weekday - first.getDay() + 7) % 7;
  const day = 1 + offset + (nth - 1) * 7;
  const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
  if (day > daysInMonth) return null;
  return new Date(year, monthIndex, day);
}
// All matching dates (inclusive) between startISO and untilISO for a given nth-weekday pattern.
function getRecurrenceDates(startISO, untilISO, weekday, nth) {
  const [sy, sm] = startISO.split("-").map(Number);
  let year = sy, month = sm - 1;
  const dates = [];
  let guard = 0;
  while (guard++ < 600) {
    const monthStartISO = `${year}-${String(month+1).padStart(2,"0")}-01`;
    if (monthStartISO > untilISO) break;
    const occ = nthWeekdayOfMonth(year, month, weekday, nth);
    if (occ) {
      const occISO = toISO(occ);
      if (occISO >= startISO && occISO <= untilISO) dates.push(occISO);
    }
    month++;
    if (month > 11) { month = 0; year++; }
  }
  return dates;
}

// ---------- .ics calendar file generation ----------
function icsNowUTC() {
  const now = new Date();
  const p = n => String(n).padStart(2, "0");
  return `${now.getUTCFullYear()}${p(now.getUTCMonth()+1)}${p(now.getUTCDate())}T${p(now.getUTCHours())}${p(now.getUTCMinutes())}${p(now.getUTCSeconds())}Z`;
}
function escapeICS(text) {
  return String(text || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
}
function icsEventBlock(ev) {
  let dtstartLine, dtendLine;
  if (ev.time) {
    const [h, m] = ev.time.split(":").map(Number);
    const [y, mo, d] = ev.date.split("-");
    const startDT = `${y}${mo}${d}T${String(h).padStart(2,"0")}${String(m).padStart(2,"0")}00`;
    let endH = h + 1;
    const endDT = `${y}${mo}${d}T${String(endH % 24).padStart(2,"0")}${String(m).padStart(2,"0")}00`;
    dtstartLine = `DTSTART:${startDT}`;
    dtendLine = `DTEND:${endDT}`;
  } else {
    const dateOnly = ev.date.replace(/-/g, "");
    const [y, mo, d] = ev.date.split("-").map(Number);
    const nextDateOnly = toISO(new Date(y, mo - 1, d + 1)).replace(/-/g, "");
    dtstartLine = `DTSTART;VALUE=DATE:${dateOnly}`;
    dtendLine = `DTEND;VALUE=DATE:${nextDateOnly}`;
  }
  return [
    "BEGIN:VEVENT",
    `UID:${ev.uid}`,
    `DTSTAMP:${icsNowUTC()}`,
    dtstartLine,
    dtendLine,
    `SUMMARY:${escapeICS(ev.summary)}`,
    ev.description ? `DESCRIPTION:${escapeICS(ev.description)}` : null,
    "END:VEVENT",
  ].filter(Boolean).join("\r\n");
}
function buildICSFile(events) {
  return [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//CalvaryScheduler//EN",
    "CALSCALE:GREGORIAN",
    ...events.map(icsEventBlock),
    "END:VCALENDAR",
  ].join("\r\n");
}
function downloadICS(filename, content) {
  const blob = new Blob([content], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function buildReminderMessage(r) {
  const roleText = r.role ? ` (${r.role})` : "";
  const timeText = r.time ? ` at ${fmtTime(r.time)}` : "";
  return `Hi ${r.volunteerName.split(" ")[0]}! Reminder: you're signed up to volunteer on ${fmtDate(r.date)}${timeText}${roleText}. Thanks for serving with Calvary Students!`;
}
async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    return false;
  }
}

// ---------- small UI atoms ----------
function Button({ children, onClick, variant = "default", disabled, style }) {
  const base = {
    padding: "8px 14px",
    borderRadius: 8,
    fontSize: 17,
    fontWeight: 600,
    border: "1px solid var(--border)",
    background: "var(--panel-2)",
    color: "var(--text)",
    transition: "background 120ms, border-color 120ms",
  };
  const variants = {
    default: {},
    accent: { background: "var(--accent)", borderColor: "var(--accent)", color: "#1c1d21" },
    ghost: { background: "transparent" },
    danger: { color: "var(--bad)", borderColor: "var(--bad)55" },
  };
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      style={{ ...base, ...variants[variant], opacity: disabled ? 0.5 : 1, cursor: disabled ? "not-allowed" : "pointer", ...style }}
    >
      {children}
    </button>
  );
}

function Field({ label, children }) {
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 16, color: "var(--muted)", minWidth: 0 }}>
      {label}
      {children}
    </label>
  );
}

const inputStyle = {
  background: "var(--panel)",
  border: "1px solid var(--border)",
  borderRadius: 8,
  padding: "9px 10px",
  color: "var(--text)",
  fontSize: 18,
  fontFamily: "inherit",
  width: "100%",
  maxWidth: "100%",
  minWidth: 0,
  boxSizing: "border-box",
  display: "block",
};

// Native date/time pickers (especially iOS Safari) can render slightly
// wider than the box they're given. Instead of fighting that, the border
// and background live on this wrapper (overflow: hidden clips anything
// that tries to spill past it), and the input itself is transparent/borderless.
const nativePickerWrapStyle = {
  border: "1px solid var(--border)",
  borderRadius: 8,
  background: "var(--panel)",
  overflow: "hidden",
  width: "100%",
  boxSizing: "border-box",
};
const nativePickerInputStyle = {
  background: "transparent",
  border: "none",
  padding: "9px 10px",
  color: "var(--text)",
  fontSize: 18,
  fontFamily: "inherit",
  width: "100%",
  minWidth: 0,
  boxSizing: "border-box",
  display: "block",
};

// ---------- App ----------
function App() {
  const ministryKey = useMemo(() => getMinistryKey(), []);
  const ministryLabel = getMinistryLabel(ministryKey);
  const volunteersCollectionName = `volunteers_${ministryKey}`;
  const slotsCollectionName = `slots_${ministryKey}`;
  const adminDocId = `admin_${ministryKey}`;

  const [fbReady, setFbReady] = useState(!!window.__fb);
  const [tab, setTab] = useState("schedule");
  const [isAdmin, setIsAdmin] = useState(sessionStorage.getItem("vs_admin") === "1");
  const [volunteers, setVolunteers] = useState([]);
  const [slots, setSlots] = useState([]);
  const [passcode, setPasscode] = useState(null); // stored admin passcode from config doc
  const [toast, setToast] = useState(null);

  useEffect(() => {
    if (fbReady) return;
    const onReady = () => setFbReady(true);
    window.addEventListener("fb-ready", onReady);
    return () => window.removeEventListener("fb-ready", onReady);
  }, [fbReady]);

  useEffect(() => {
    if (!fbReady) return;
    const { db, collection, onSnapshot, query, orderBy, doc, getDoc } = window.__fb;

    const unsubVol = onSnapshot(
      collection(db, volunteersCollectionName),
      snap => setVolunteers(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => lastNameOf(a.name).localeCompare(lastNameOf(b.name)) || a.name.localeCompare(b.name))),
      err => window.showFatal && window.showFatal("Volunteers listener error: " + err.code + " — " + err.message)
    );
    const unsubSlots = onSnapshot(
      query(collection(db, slotsCollectionName), orderBy("date")),
      snap => setSlots(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
      err => window.showFatal && window.showFatal("Slots listener error: " + err.code + " — " + err.message)
    );
    getDoc(doc(db, "config", adminDocId)).then(snap => {
      if (snap.exists()) setPasscode(snap.data().passcode);
      else setPasscode(null);
    }).catch(err => window.showFatal && window.showFatal("Config read error: " + err.code + " — " + err.message));
    return () => { unsubVol(); unsubSlots(); };
  }, [fbReady, volunteersCollectionName, slotsCollectionName, adminDocId]);

  function showToast(msg, kind = "good") {
    setToast({ msg, kind });
    setTimeout(() => setToast(null), 2800);
  }

  function tryUnlock(code) {
    if (passcode && code === passcode) {
      sessionStorage.setItem("vs_admin", "1");
      setIsAdmin(true);
      showToast("Admin unlocked");
    } else if (!passcode && code) {
      // first-run: no passcode set yet, whatever they type becomes it
      window.__fb.setDoc(window.__fb.doc(window.__fb.db, "config", adminDocId), { passcode: code });
      setPasscode(code);
      sessionStorage.setItem("vs_admin", "1");
      setIsAdmin(true);
      showToast("Admin passcode set — remember it!");
    } else {
      showToast("Wrong passcode", "bad");
    }
  }

  function logout() {
    sessionStorage.removeItem("vs_admin");
    setIsAdmin(false);
    if (tab !== "schedule") setTab("schedule");
    showToast("Logged out");
  }

  if (!fbReady) {
    return <Centered>Loading…</Centered>;
  }

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column" }}>
      <Header tab={tab} setTab={setTab} isAdmin={isAdmin} ministryLabel={ministryLabel} onLogout={logout} />
      <main style={{ flex: 1, maxWidth: 880, margin: "0 auto", width: "100%", padding: "20px 26px 60px", boxSizing: "border-box" }}>
        {tab === "schedule" && <ScheduleView slots={slots} isAdmin={isAdmin} ministryLabel={ministryLabel} />}
        {tab === "manage" && (isAdmin
          ? <ManageView volunteers={volunteers} slots={slots} showToast={showToast} volunteersCollectionName={volunteersCollectionName} slotsCollectionName={slotsCollectionName} />
          : <AdminGate onSubmit={tryUnlock} firstRun={passcode === null} />)}
        {tab === "reminders" && (isAdmin
          ? <RemindersView volunteers={volunteers} slots={slots} showToast={showToast} slotsCollectionName={slotsCollectionName} ministryKey={ministryKey} />
          : <AdminGate onSubmit={tryUnlock} firstRun={passcode === null} />)}
      </main>
      {toast && (
        <div style={{
          position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)",
          background: "var(--panel-2)", border: `1px solid ${toast.kind === "bad" ? "var(--bad)" : "var(--good)"}`,
          color: "var(--text)", padding: "10px 18px", borderRadius: 10, fontSize: 17, zIndex: 50,
        }}>
          {toast.msg}
        </div>
      )}
    </div>
  );
}

function Centered({ children }) {
  return <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: "var(--muted)" }}>{children}</div>;
}

function Header({ tab, setTab, isAdmin, ministryLabel, onLogout }) {
  const tabs = [
    { id: "schedule", label: "Schedule" },
    { id: "manage", label: "Manage" },
    { id: "reminders", label: "Reminders" },
  ];
  return (
    <header style={{ borderBottom: "1px solid var(--border)", position: "sticky", top: 0, background: "var(--bg)", zIndex: 10 }}>
      <div style={{ maxWidth: 880, margin: "0 auto", padding: "16px 26px 0", boxSizing: "border-box", position: "relative" }}>
        {isAdmin && (
          <button
            onClick={onLogout}
            className="mono"
            style={{
              position: "absolute", top: 16, right: 26,

// ---------- Schedule (public) ----------
function ScheduleView({ slots, ministryLabel }) {
  const grouped = useMemo(() => {
    const byDate = {};
    for (const s of slots) {
      if (!byDate[s.date]) byDate[s.date] = {};
      if (!byDate[s.date][s.time]) byDate[s.date][s.time] = [];
      byDate[s.date][s.time].push(s);
    }
    return Object.entries(byDate)
      .sort(([a], [b]) => a.localeCompare(b))
      .map(([date, byTime]) => ({
        date,
        times: Object.entries(byTime)
          .sort(([a], [b]) => a.localeCompare(b))
          .map(([time, items]) => [
            time,
            [...items].sort((a, b) => lastNameOf(a.volunteerName).localeCompare(lastNameOf(b.volunteerName)) || (a.volunteerName || "").localeCompare(b.volunteerName || "")),
          ]),
      }));
  }, [slots]);

  const [calendarChoiceKey, setCalendarChoiceKey] = useState(null);

  function cardKey(date, time) { return date + "|" + time; }

  function buildSummary(items) {
    const names = items.map(s => s.volunteerName).filter(Boolean);
    const role = items.find(s => s.role)?.role;
    let summary = ministryLabel ? `${ministryLabel} Volunteer Shift` : "Volunteer Shift";
    if (role) summary += ` — ${role}`;
    return summary;
  }
  function buildDescription(items) {
    const names = items.map(s => s.volunteerName).filter(Boolean);
    return names.length ? `Volunteers: ${names.join(", ")}` : "Open shift";
  }

  function downloadJustThis(date, time, items) {
    const ics = buildICSFile([{
      uid: `${items[0]?.id || `${date}-${time}`}@calvaryscheduler`,
      date, time, summary: buildSummary(items), description: buildDescription(items),
    }]);
    downloadICS(`shift-${date}.ics`, ics);
    setCalendarChoiceKey(null);
  }

  function downloadAllFuture(date, time, items) {
    const seriesId = items.find(it => it.seriesId)?.seriesId;
    const seriesItemsByDate = {};
    for (const s of slots) {
      if (s.seriesId === seriesId && s.date >= date) {
        const key = s.date + "|" + s.time;
        if (!seriesItemsByDate[key]) seriesItemsByDate[key] = [];
        seriesItemsByDate[key].push(s);
      }
    }
    const events = Object.entries(seriesItemsByDate).map(([key, its]) => {
      const [d, t] = key.split("|");
      return {
        uid: `${its[0]?.id || key}@calvaryscheduler`,
        date: d, time: t, summary: buildSummary(its), description: buildDescription(its),
      };
    });
    const ics = buildICSFile(events);
    downloadICS(`shifts-${date}-and-future.ics`, ics);
    setCalendarChoiceKey(null);
  }

  if (grouped.length === 0) {
    return <Empty text="No shifts scheduled yet." />;
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 26 }}>
      {grouped.map(({ date, times }) => (
        <div key={date} style={{ display: "flex", gap: 14 }}>
          <div style={{ width: 3, background: "var(--border)", borderRadius: 2 }} />
          <div style={{ flex: 1 }}>
            <div className="stub-font" style={{ fontSize: 30, color: "var(--text)", fontWeight: 700, marginBottom: 12 }}>{fmtDate(date)}</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
              {times.map(([time, items]) => {
                const key = cardKey(date, time);
                const hasSeries = items.some(it => it.seriesId);
                const isChoosing = calendarChoiceKey === key;
                return (
                <div key={time} className="ticket">
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
                    <div className="ticket-hero-time">{time ? fmtTime(time) : "All Day"}</div>
                    <button
                      onClick={() => hasSeries ? setCalendarChoiceKey(isChoosing ? null : key) : downloadJustThis(date, time, items)}
                      style={{
                        background: "var(--panel-2)", border: "1px solid var(--border)", borderRadius: 20,
                        padding: "6px 12px", fontSize: 13, color: "var(--muted)", fontWeight: 600,
                        cursor: "pointer", touchAction: "manipulation", WebkitTapHighlightColor: "transparent",
                        whiteSpace: "nowrap",
                      }}
                    >
                      📅 Add to calendar
                    </button>
                  </div>
                  {isChoosing && (
                    <div style={{ display: "flex", gap: 8, flexWrap: "wrap", margin: "10px 0" }}>
                      <Button onClick={() => downloadJustThis(date, time, items)}>Just this shift</Button>
                      <Button onClick={() => downloadAllFuture(date, time, items)}>All future instances</Button>
                      <Button variant="ghost" onClick={() => setCalendarChoiceKey(null)}>Cancel</Button>
                    </div>
                  )}
                  <div className="ticket-divider" />
                  <div className="ticket-names">
                    {items.map(s => (
                      <div key={s.id} className="ticket-name-row">
                        <span style={{ fontSize: 15, color: "var(--muted)", fontWeight: 500 }}>
                          {s.volunteerName || <span style={{ fontStyle: "italic" }}>Open</span>}
                        </span>
                        {s.role && <span style={{ fontSize: 13, color: "var(--muted)" }}>{s.role}</span>}
                      </div>
                    ))}
                  </div>
                </div>
                );
              })}
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

function Empty({ text }) {
  return <div style={{ textAlign: "center", color: "var(--muted)", padding: "60px 0", fontSize: 17 }}>{text}</div>;
}

function ManageView({ volunteers, slots, showToast, volunteersCollectionName, slotsCollectionName }) {
  const { db, collection, addDoc, updateDoc, deleteDoc, doc } = window.__fb;
  const [manageSection, setManageSection] = useState("add"); // "shifts" | "add" | "volunteers"
  const [vName, setVName] = useState("");
  const [vPhone, setVPhone] = useState("");
  const [vEmail, setVEmail] = useState("");

  const [sDate, setSDate] = useState(todayISO());
  const [sTime, setSTime] = useState("09:00");
  const [sAllDay, setSAllDay] = useState(false);
  const [sRole, setSRole] = useState("");
  const [sSelectedVolIds, setSSelectedVolIds] = useState([]);
  const [sRepeat, setSRepeat] = useState(false);
  const [sRepeatUntil, setSRepeatUntil] = useState("");

  const repeatPattern = useMemo(() => computeNthWeekday(sDate), [sDate]);
  const repeatLabel = `Repeats on the ${ordinal(repeatPattern.nth)} ${WEEKDAY_NAMES[repeatPattern.weekday]} of every month`;

  function toggleSelectedVol(id) {
    setSSelectedVolIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  }

  async function addVolunteer() {
    if (!vName.trim()) return;
    await addDoc(collection(db, volunteersCollectionName), { name: vName.trim(), phone: vPhone.trim(), email: vEmail.trim() });
    setVName(""); setVPhone(""); setVEmail("");
    showToast("Volunteer added");
  }

  const [csvImporting, setCsvImporting] = useState(false);

  async function handleCSVFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // allow re-selecting the same file later
    if (!file) return;

    setCsvImporting(true);
    try {
      const text = await file.text();
      const rows = parseCSV(text);
      if (rows.length === 0) {
        showToast("No rows found in that file", "bad");
        return;
      }

      const headerCells = rows[0].map(h => h.trim().toLowerCase());
      let nameIdx = headerCells.findIndex(h => h.includes("name"));
      let phoneIdx = headerCells.findIndex(h => h.includes("phone"));
      let emailIdx = headerCells.findIndex(h => h.includes("email"));
      let dataRows;
      if (nameIdx !== -1) {
        dataRows = rows.slice(1);
      } else {
        nameIdx = 0; phoneIdx = 1; emailIdx = 2;
        dataRows = rows;
      }

      const existingNames = new Set(volunteers.map(v => (v.name || "").trim().toLowerCase()));
      let added = 0, skipped = 0;

      for (const r of dataRows) {
        const name = (r[nameIdx] || "").trim();
        if (!name) continue;
        if (existingNames.has(name.toLowerCase())) { skipped++; continue; }
        const phone = phoneIdx >= 0 ? (r[phoneIdx] || "").trim() : "";
        const email = emailIdx >= 0 ? (r[emailIdx] || "").trim() : "";
        await addDoc(collection(db, volunteersCollectionName), { name, phone, email });
        existingNames.add(name.toLowerCase());
        added++;
      }

      showToast(
        skipped > 0 ? `Imported ${added} (skipped ${skipped} duplicate${skipped > 1 ? "s" : ""})` : `Imported ${added} volunteer${added === 1 ? "" : "s"}`
      );
    } catch (err) {
      showToast("Couldn't read that file", "bad");
    } finally {
      setCsvImporting(false);
    }
  }

  async function removeVolunteer(id, name) {
    if (!window.confirm(`Remove ${name || "this volunteer"}? This can't be undone.`)) return;
    await deleteDoc(doc(db, volunteersCollectionName, id));
    showToast("Volunteer removed");
  }

  const [editingVolId, setEditingVolId] = useState(null);
  const [evName, setEvName] = useState("");
  const [evPhone, setEvPhone] = useState("");
  const [evEmail, setEvEmail] = useState("");

  function startEditVolunteer(v) {
    setEditingVolId(v.id);
    setEvName(v.name || "");
    setEvPhone(v.phone || "");
    setEvEmail(v.email || "");
  }

  function cancelEditVolunteer() {
    setEditingVolId(null);
  }

  async function saveVolunteerEdit() {
    if (!evName.trim()) return;
    await updateDoc(doc(db, volunteersCollectionName, editingVolId), {
      name: evName.trim(), phone: evPhone.trim(), email: evEmail.trim(),
    });
    setEditingVolId(null);
    showToast("Volunteer updated");
  }

  async function addSlot() {
    const effectiveTime = sAllDay ? "" : sTime;
    if (!sDate || (!sAllDay && !sTime)) return;
    if (sRepeat && !sRepeatUntil) {
      showToast("Pick an end date for the repeat", "bad");
      return;
    }
    if (sRepeat && sRepeatUntil < sDate) {
      showToast("End date must be after the start date", "bad");
      return;
    }

    const dates = sRepeat
      ? getRecurrenceDates(sDate, sRepeatUntil, repeatPattern.weekday, repeatPattern.nth)
      : [sDate];
    const seriesId = sRepeat ? (crypto.randomUUID ? crypto.randomUUID() : `series_${Date.now()}_${Math.random().toString(36).slice(2)}`) : null;

    const jobs = [];
    for (const date of dates) {
      if (sSelectedVolIds.length === 0) {
        jobs.push(addDoc(collection(db, slotsCollectionName), {
          date, time: effectiveTime, role: sRole.trim(),
          volunteerId: null, volunteerName: null,
          reminderSentAt: null, seriesId,
        }));
      } else {
        for (const id of sSelectedVolIds) {
          const vol = volunteers.find(v => v.id === id);
          jobs.push(addDoc(collection(db, slotsCollectionName), {
            date, time: effectiveTime, role: sRole.trim(),
            volunteerId: vol.id, volunteerName: vol.name,
            reminderSentAt: null, seriesId,
          }));
        }
      }
    }
    await Promise.all(jobs);

    if (sRepeat) {
      showToast(`Created ${dates.length} occurrence${dates.length > 1 ? "s" : ""}${sSelectedVolIds.length ? ` for ${sSelectedVolIds.length} volunteer${sSelectedVolIds.length > 1 ? "s" : ""}` : ""}`);
    } else if (sSelectedVolIds.length === 0) {
      showToast("Open shift added");
    } else {
      showToast(`Added ${sSelectedVolIds.length} volunteer${sSelectedVolIds.length > 1 ? "s" : ""}`);
    }
    setSRole("");
    setSSelectedVolIds([]);
    setSRepeat(false);
    setSRepeatUntil("");
  }

  async function removeSlot(id) {
    await deleteDoc(doc(db, slotsCollectionName, id));
    showToast("Shift removed");
  }

  const manageDateGroups = useMemo(() => {
    const byDate = {};
    for (const s of slots) {
      if (!byDate[s.date]) byDate[s.date] = {};
      if (!byDate[s.date][s.time]) byDate[s.date][s.time] = [];
      byDate[s.date][s.time].push(s);
    }
    return Object.entries(byDate)
      .sort(([a], [b]) => a.localeCompare(b))
      .map(([date, byTime]) => ({
        date,
        shifts: Object.entries(byTime)
          .sort(([a], [b]) => a.localeCompare(b))
          .map(([time, items]) => ({
            key: date + "|" + time,
            date, time,
            items: [...items].sort((a, b) => lastNameOf(a.volunteerName).localeCompare(lastNameOf(b.volunteerName)) || (a.volunteerName || "").localeCompare(b.volunteerName || "")),
          })),
      }));
  }, [slots]);

  const [roleDrafts, setRoleDrafts] = useState({});

  async function saveRoleForGroup(items, key) {
    const draft = roleDrafts[key];
    if (draft === undefined) return;
    const newRole = draft.trim();
    if (items.every(it => (it.role || "") === newRole)) {
      setRoleDrafts(prev => { const next = { ...prev }; delete next[key]; return next; });
      return;
    }
    await Promise.all(items.map(it => updateDoc(doc(db, slotsCollectionName, it.id), { role: newRole })));
    setRoleDrafts(prev => { const next = { ...prev }; delete next[key]; return next; });
    showToast("Note updated");
  }

  async function addVolunteerToShift(group, volunteerId) {
    if (!volunteerId) return;
    const vol = volunteers.find(v => v.id === volunteerId);
    if (!vol) return;
    const role = roleDrafts[group.key] !== undefined ? roleDrafts[group.key].trim() : (group.items[0]?.role || "");
    await addDoc(collection(db, slotsCollectionName), {
      date: group.date, time: group.time, role,
      volunteerId: vol.id, volunteerName: vol.name,
      reminderSentAt: null,
    });
    showToast(`Added ${vol.name}`);
  }

  const [duplicatingKey, setDuplicatingKey] = useState(null);
  const [duplicateDate, setDuplicateDate] = useState("");

  function closeAllPanels() {
    setDuplicatingKey(null);
    setEditingKey(null);
    setDeletingKey(null);
  }

  function startDuplicate(group) {
    closeAllPanels();
    setDuplicatingKey(group.key);
    setDuplicateDate(addDaysISO(group.date, 7));
  }

  function cancelDuplicate() {
    setDuplicatingKey(null);
  }

  async function confirmDuplicate(group) {
    if (!duplicateDate) return;
    const role = roleDrafts[group.key] !== undefined ? roleDrafts[group.key].trim() : (group.items[0]?.role || "");
    const jobs = group.items.map(it => addDoc(collection(db, slotsCollectionName), {
      date: duplicateDate, time: group.time, role,
      volunteerId: it.volunteerId || null, volunteerName: it.volunteerName || null,
      reminderSentAt: null,
    }));
    await Promise.all(jobs);
    showToast(`Duplicated to ${fmtDate(duplicateDate)}`);
    setDuplicatingKey(null);
  }

  // ---- Edit shift (date/time/role), series-aware ----
  const [editingKey, setEditingKey] = useState(null);
  const [editDraft, setEditDraft] = useState({ date: "", time: "09:00", allDay: false, role: "" });

  function startEdit(group) {
    closeAllPanels();
    setEditingKey(group.key);
    setEditDraft({
      date: group.date,
      time: group.time || "09:00",
      allDay: !group.time,
      role: group.items[0]?.role || "",
    });
  }

  function cancelEdit() {
    setEditingKey(null);
  }

  async function saveEditJustThis(group) {
    const effectiveTime = editDraft.allDay ? "" : editDraft.time;
    const hasSeries = group.items.some(it => it.seriesId);
    await Promise.all(group.items.map(it => updateDoc(doc(db, slotsCollectionName, it.id), {
      date: editDraft.date, time: effectiveTime, role: editDraft.role.trim(),
      ...(hasSeries ? { seriesId: null } : {}),
    })));
    setEditingKey(null);
    showToast("Shift updated");
  }

  async function saveEditThisAndFuture(group) {
    const effectiveTime = editDraft.allDay ? "" : editDraft.time;
    const seriesId = group.items.find(it => it.seriesId)?.seriesId;
    const dateChanged = editDraft.date !== group.date;

    // Update "this" occurrence
    await Promise.all(group.items.map(it => updateDoc(doc(db, slotsCollectionName, it.id), {
      date: editDraft.date, time: effectiveTime, role: editDraft.role.trim(),
    })));

    if (seriesId) {
      const oldFutureItems = slots.filter(s => s.seriesId === seriesId && s.date > group.date);

      if (!dateChanged) {
        // Same pattern — just propagate time/role, each occurrence keeps its own date
        await Promise.all(oldFutureItems.map(it => updateDoc(doc(db, slotsCollectionName, it.id), {
          time: effectiveTime, role: editDraft.role.trim(),
        })));
      } else if (oldFutureItems.length > 0) {
        // Date/pattern changed (e.g. 1st Monday -> 2nd Monday) — regenerate future
        // occurrences under the new pattern instead of leaving them on the old dates.
        const latestOldDate = oldFutureItems.reduce((max, it) => it.date > max ? it.date : max, group.date);
        const newPattern = computeNthWeekday(editDraft.date);
        const newDates = getRecurrenceDates(editDraft.date, latestOldDate, newPattern.weekday, newPattern.nth)
          .filter(d => d > editDraft.date);

        await Promise.all(oldFutureItems.map(it => deleteDoc(doc(db, slotsCollectionName, it.id))));

        const templatePeople = group.items.map(it => ({ volunteerId: it.volunteerId || null, volunteerName: it.volunteerName || null }));
        const jobs = [];
        for (const d of newDates) {
          for (const p of templatePeople) {
            jobs.push(addDoc(collection(db, slotsCollectionName), {
              date: d, time: effectiveTime, role: editDraft.role.trim(),
              volunteerId: p.volunteerId, volunteerName: p.volunteerName,
              reminderSentAt: null, seriesId,
            }));
          }
        }
        await Promise.all(jobs);
      }
    }
    setEditingKey(null);
    showToast(dateChanged && seriesId ? "Updated the pattern for this and future shifts" : "Updated this and future shifts");
  }

  // ---- Delete shift, series-aware ----
  const [deletingKey, setDeletingKey] = useState(null);

  function startDelete(group) {
    closeAllPanels();
    setDeletingKey(group.key);
  }

  function cancelDelete() {
    setDeletingKey(null);
  }

  async function deleteJustThis(group) {
    await Promise.all(group.items.map(it => deleteDoc(doc(db, slotsCollectionName, it.id))));
    setDeletingKey(null);
    showToast("Shift deleted");
  }

  async function deleteThisAndFuture(group) {
    const seriesId = group.items.find(it => it.seriesId)?.seriesId;
    const toDelete = slots.filter(s => s.seriesId === seriesId && s.date >= group.date);
    await Promise.all(toDelete.map(it => deleteDoc(doc(db, slotsCollectionName, it.id))));
    setDeletingKey(null);
    showToast(`Deleted ${toDelete.length} shift${toDelete.length === 1 ? "" : "s"}`);
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>
      <ManageNav manageSection={manageSection} setManageSection={setManageSection} />

      {manageSection === "add" && (
      <>
      <section>
        <SectionTitle>Add a shift</SectionTitle>
        <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 14, background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, padding: 16, width: "100%", boxSizing: "border-box" }}>
          <Field label="Date">
            <div style={nativePickerWrapStyle}>
              <input style={nativePickerInputStyle} type="date" value={sDate} onChange={e => setSDate(e.target.value)} />
            </div>
          </Field>
          <Field label="Time">
            <div style={{ ...nativePickerWrapStyle, opacity: sAllDay ? 0.4 : 1 }}>
              <input
                style={nativePickerInputStyle}
                type="time"
                step="900"
                value={sTime}
                onChange={e => setSTime(e.target.value)}
                disabled={sAllDay}
              />
            </div>
          </Field>
          <div>
            <label style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 16, cursor: "pointer" }}>
              <input
                type="checkbox"
                checked={sAllDay}
                onChange={e => setSAllDay(e.target.checked)}
                style={{ width: 20, height: 20, accentColor: "var(--accent)", flexShrink: 0 }}
              />
              All day
            </label>
          </div>
          <div>
            <label style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 16, cursor: "pointer" }}>
              <input
                type="checkbox"
                checked={sRepeat}
                onChange={e => setSRepeat(e.target.checked)}
                style={{ width: 20, height: 20, accentColor: "var(--accent)", flexShrink: 0 }}
              />
              Repeat monthly
            </label>
            {sRepeat && (
              <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 10, paddingLeft: 30 }}>
                <div style={{ fontSize: 14, color: "var(--accent)" }}>{repeatLabel}</div>
                <Field label="Until">
                  <div style={nativePickerWrapStyle}>
                    <input
                      style={nativePickerInputStyle}
                      type="date"
                      value={sRepeatUntil}
                      min={sDate}
                      onChange={e => setSRepeatUntil(e.target.value)}
                    />
                  </div>
                </Field>
              </div>
            )}
          </div>
          <div>
            <Field label="Role / notes (optional — applies to everyone added below)">
              <input style={inputStyle} value={sRole} onChange={e => setSRole(e.target.value)} placeholder="e.g. Check-in table" />
            </Field>
          </div>
          <div>
            <Field label="Assign volunteers (tap all that apply)">
              <div style={{ display: "flex", flexDirection: "column", gap: 4, background: "var(--panel-2)", border: "1px solid var(--border)", borderRadius: 8, padding: 8 }}>
                {volunteers.length === 0 && <div style={{ fontSize: 15, color: "var(--muted)", padding: 6 }}>No volunteers yet — add some below first.</div>}
                {volunteers.map(v => {
                  const isChecked = sSelectedVolIds.includes(v.id);
                  return (
                    <div
                      key={v.id}
                      onClick={() => toggleSelectedVol(v.id)}
                      style={{
                        display: "flex", alignItems: "center", gap: 10, fontSize: 16,
                        padding: "10px 6px", borderRadius: 6, cursor: "pointer", color: "var(--text)",
                        touchAction: "manipulation", WebkitTapHighlightColor: "transparent", userSelect: "none",
                      }}
                    >
                      <div style={{
                        width: 22, height: 22, borderRadius: 5, flexShrink: 0,
                        border: `2px solid ${isChecked ? "var(--accent)" : "var(--border)"}`,
                        background: isChecked ? "var(--accent)" : "transparent",
                        display: "flex", alignItems: "center", justifyContent: "center",
                      }}>
                        {isChecked && <span style={{ color: "#1c1d21", fontSize: 14, fontWeight: 700, lineHeight: 1 }}>✓</span>}
                      </div>
                      {v.name}
                    </div>
                  );
                })}
              </div>
            </Field>
            <div style={{ fontSize: 13, color: "var(--muted)", marginTop: 6 }}>Leave everyone unchecked to add an open (unassigned) shift instead.</div>
          </div>
          <div style={{ gridColumn: "1 / -1" }}>
            <Button variant="accent" onClick={addSlot}>
              {sRepeat
                ? "Create recurring shift"
                : sSelectedVolIds.length > 0
                ? `Add ${sSelectedVolIds.length} volunteer${sSelectedVolIds.length > 1 ? "s" : ""} to this shift`
                : "Add open shift"}
            </Button>
          </div>
        </div>
      </section>
      <ManageNav manageSection={manageSection} setManageSection={setManageSection} />
      </>
      )}

      {manageSection === "shifts" && (
      <>
      <section>
        <SectionTitle>All shifts</SectionTitle>
        {manageDateGroups.length === 0 && <Empty text="No shifts yet." />}
        <div style={{ display: "flex", flexDirection: "column", gap: 28 }}>
          {manageDateGroups.map(({ date, shifts }) => (
            <div key={date}>
              <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 14 }}>
                <div className="stub-font" style={{ fontSize: 20, color: "var(--text)", fontWeight: 700, whiteSpace: "nowrap" }}>
                  {fmtDate(date)}
                </div>
                <div style={{ flex: 1, height: 1, background: "var(--border)" }} />
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                {shifts.map(g => {
                  const roleValue = roleDrafts[g.key] !== undefined ? roleDrafts[g.key] : (g.items[0]?.role || "");
                  const availableToAdd = volunteers.filter(v => !g.items.some(it => it.volunteerId === v.id));
                  const isDuplicating = duplicatingKey === g.key;
                  const isEditing = editingKey === g.key;
                  const isDeleting = deletingKey === g.key;
                  const hasSeries = g.items.some(it => it.seriesId);
                  return (
                    <div key={g.key} style={{ background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, overflow: "hidden" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", background: "var(--panel-2)", flexWrap: "wrap" }}>
                        <div className="stub-font" style={{ fontSize: 17, color: "var(--accent)", fontWeight: 700 }}>
                          {g.time ? fmtTime(g.time) : "All day"}
                        </div>
                        <div style={{ fontSize: 14, color: "var(--muted)" }}>
                          {g.items.length} {g.items.length === 1 ? "person" : "people"}
                          {hasSeries && <span title="Part of a recurring series"> · ↻ recurring</span>}
                        </div>
                        <div style={{ marginLeft: "auto", display: "flex", gap: 6 }}>
                          <Button onClick={() => startEdit(g)}>Edit</Button>
                          <Button onClick={() => startDuplicate(g)}>Duplicate</Button>
                          <Button variant="danger" onClick={() => startDelete(g)}>Delete</Button>
                        </div>
                      </div>

                      <div style={{ padding: "12px 14px", display: "flex", flexDirection: "column", gap: 12 }}>
                        {isDeleting && (
                          <div style={{ display: "flex", flexDirection: "column", gap: 10, padding: 12, background: "var(--panel-2)", border: "1px solid var(--bad)", borderRadius: 8 }}>
                            <div style={{ fontSize: 15 }}>
                              {hasSeries
                                ? "This shift is part of a recurring series. Delete just this occurrence, or this and every future one too?"
                                : "Delete this shift? This can't be undone."}
                            </div>
                            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                              <Button variant="danger" onClick={() => deleteJustThis(g)}>
                                {hasSeries ? "Delete just this one" : "Delete"}
                              </Button>
                              {hasSeries && (
                                <Button variant="danger" onClick={() => deleteThisAndFuture(g)}>Delete this + future</Button>
                              )}
                              <Button variant="ghost" onClick={cancelDelete}>Cancel</Button>
                            </div>
                          </div>
                        )}
                        {isEditing && (
                          <div style={{ display: "flex", flexDirection: "column", gap: 10, padding: 12, background: "var(--panel-2)", border: "1px solid var(--accent)", borderRadius: 8 }}>
                            <Field label="Date">
                              <div style={nativePickerWrapStyle}>
                                <input
                                  style={nativePickerInputStyle}
                                  type="date"
                                  value={editDraft.date}
                                  onChange={e => setEditDraft(prev => ({ ...prev, date: e.target.value }))}
                                />
                              </div>
                            </Field>
                            <Field label="Time">
                              <div style={{ ...nativePickerWrapStyle, opacity: editDraft.allDay ? 0.4 : 1 }}>
                                <input
                                  style={nativePickerInputStyle}
                                  type="time"
                                  step="900"
                                  value={editDraft.time}
                                  disabled={editDraft.allDay}
                                  onChange={e => setEditDraft(prev => ({ ...prev, time: e.target.value }))}
                                />
                              </div>
                            </Field>
                            <label style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 16, cursor: "pointer" }}>
                              <input
                                type="checkbox"
                                checked={editDraft.allDay}
                                onChange={e => setEditDraft(prev => ({ ...prev, allDay: e.target.checked }))}
                                style={{ width: 20, height: 20, accentColor: "var(--accent)", flexShrink: 0 }}
                              />
                              All day
                            </label>
                            <Field label="Role / notes">
                              <input
                                style={inputStyle}
                                value={editDraft.role}
                                onChange={e => setEditDraft(prev => ({ ...prev, role: e.target.value }))}
                              />
                            </Field>
                            {hasSeries && (
                              <div style={{ fontSize: 13, color: "var(--muted)" }}>
                                This is part of a recurring series. "This + future" applies time/role changes to every future occurrence. If you change the date, future occurrences are regenerated to follow the new pattern (e.g. switching this from the 1st Monday to the 2nd Monday will move all future ones to the 2nd Monday too).
                              </div>
                            )}
                            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                              <Button variant="accent" onClick={() => saveEditJustThis(g)}>
                                {hasSeries ? "Save just this one" : "Save"}
                              </Button>
                              {hasSeries && (
                                <Button variant="accent" onClick={() => saveEditThisAndFuture(g)}>Save this + future</Button>
                              )}
                              <Button variant="ghost" onClick={cancelEdit}>Cancel</Button>
                            </div>
                          </div>
                        )}
                        {isDuplicating && (
                          <div style={{ display: "flex", flexDirection: "column", gap: 10, padding: 12, background: "var(--panel-2)", border: "1px solid var(--accent)", borderRadius: 8 }}>
                            <Field label="Duplicate this shift to">
                              <div style={nativePickerWrapStyle}>
                                <input
                                  style={nativePickerInputStyle}
                                  type="date"
                                  value={duplicateDate}
                                  onChange={e => setDuplicateDate(e.target.value)}
                                />
                              </div>
                            </Field>
                            <div style={{ display: "flex", gap: 8 }}>
                              <Button variant="accent" onClick={() => confirmDuplicate(g)}>Duplicate</Button>
                              <Button variant="ghost" onClick={cancelDuplicate}>Cancel</Button>
                            </div>
                          </div>
                        )}
                        <Field label="Role / notes">
                          <input
                            style={inputStyle}
                            value={roleValue}
                            placeholder="e.g. Check-in table"
                            onChange={e => setRoleDrafts(prev => ({ ...prev, [g.key]: e.target.value }))}
                            onBlur={() => saveRoleForGroup(g.items, g.key)}
                          />
                        </Field>

                        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                          {g.items.map(it => (
                            <div key={it.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 10px", background: "var(--panel-2)", border: "1px solid var(--border)", borderRadius: 8 }}>
                              <div style={{ fontSize: 16, flex: 1 }}>
                                {it.volunteerName || <span style={{ color: "var(--muted)", fontStyle: "italic" }}>Open</span>}
                              </div>
                              <Button variant="danger" onClick={() => removeSlot(it.id)}>Remove</Button>
                            </div>
                          ))}
                        </div>

                        <Field label="Add someone to this shift">
                          <select
                            style={inputStyle}
                            value=""
                            onChange={e => addVolunteerToShift(g, e.target.value)}
                          >
                            <option value="">— Choose a volunteer —</option>
                            {availableToAdd.map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
                          </select>
                        </Field>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      </section>
      <ManageNav manageSection={manageSection} setManageSection={setManageSection} />
      </>
      )}

      {manageSection === "volunteers" && (
      <>
      <section>
        <SectionTitle>Volunteers</SectionTitle>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
          <label style={{
            padding: "8px 14px", borderRadius: 8, fontSize: 17, fontWeight: 600,
            border: "1px solid var(--border)", background: "var(--panel-2)", color: "var(--text)",
            display: "inline-flex", alignItems: "center", justifyContent: "center",
            width: "fit-content", cursor: csvImporting ? "not-allowed" : "pointer",
            opacity: csvImporting ? 0.6 : 1,
          }}>
            {csvImporting ? "Importing…" : "Import from CSV"}
            <input
              type="file"
              accept=".csv,text/csv"
              onChange={handleCSVFile}
              disabled={csvImporting}
              style={{ display: "none" }}
            />
          </label>
          <div style={{ fontSize: 13, color: "var(--muted)" }}>
            CSV should have a header row with Name, Phone, Email columns (any order) — or just three plain columns in that order. Rows matching an existing name are skipped.
          </div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 10, background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 12, padding: 16, marginBottom: 12 }}>
          <Field label="Name"><input style={inputStyle} value={vName} onChange={e => setVName(e.target.value)} /></Field>
          <Field label="Phone"><input style={inputStyle} value={vPhone} onChange={e => setVPhone(e.target.value)} placeholder="313-555-0100" /></Field>
          <Field label="Email"><input style={inputStyle} value={vEmail} onChange={e => setVEmail(e.target.value)} /></Field>
          <div style={{ gridColumn: "1 / -1" }}>
            <Button variant="accent" onClick={addVolunteer}>Add volunteer</Button>
          </div>
        </div>
        <SectionTitle>Volunteer list ({volunteers.length})</SectionTitle>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {volunteers.map(v => (
            <div key={v.id} style={{ padding: "12px 14px", background: "var(--panel)", border: "1px solid var(--border)", borderRadius: 10 }}>
              {editingVolId === v.id ? (
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  <Field label="Name"><input style={inputStyle} value={evName} onChange={e => setEvName(e.target.value)} /></Field>
                  <Field label="Phone"><input style={inputStyle} value={evPhone} onChange={e => setEvPhone(e.target.value)} placeholder="313-555-0100" /></Field>
                  <Field label="Email"><input style={inputStyle} value={evEmail} onChange={e => setEvEmail(e.target.value)} /></Field>
                  <div style={{ display: "flex", gap: 8 }}>
                    <Button variant="accent" onClick={saveVolunteerEdit}>Save</Button>
                    <Button variant="ghost" onClick={cancelEditVolunteer}>Cancel</Button>
                  </div>
                </div>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                  <div style={{ fontWeight: 600, fontSize: 17 }}>{v.name}</div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: "2px 10px", fontSize: 15, color: "var(--muted)" }}>
                    {v.phone && <span className="mono">{v.phone}</span>}
                    {v.email && <span style={{ overflowWrap: "anywhere" }}>{v.email}</span>}
                  </div>
                  <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                    <Button onClick={() => startEditVolunteer(v)}>Edit</Button>
                    <Button variant="danger" onClick={() => removeVolunteer(v.id, v.name)}>Remove</Button>
                  </div>
                </div>
              )}
            </div>
          ))}
        </div>
      </section>
      <ManageNav manageSection={manageSection} setManageSection={setManageSection} />
      </>
      )}
    </div>
  );
}

function SectionTitle({ children }) {
  return <div style={{ fontSize: 16, fontWeight: 700, color: "var(--muted)", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 10 }}>{children}</div>;
}

// ---------- Reminders (admin) ----------
function RemindersView({ volunteers, slots, showToast, slotsCollectionName, ministryKey }) {
  const { db, doc, updateDoc } = window.__fb;
  const [sending, setSending] = useState(false);
  const [emailStatus, setEmailStatus] = useState({}); // slotId -> "sent" | "error"
  const [selectedKeys, setSelectedKeys] = useState(() => new Set());

  const upcoming = useMemo(() => {
    const today = todayISO();
    return slots
      .filter(s => s.volunteerId && s.date >= today)
      .map(s => {
        const vol = volunteers.find(v => v.id === s.volunteerId);
        return { ...s, phone: vol?.phone, email: vol?.email };
      })
      .sort((a,b) => (a.date + a.time).localeCompare(b.date + b.time));
  }, [slots, volunteers]);

  const shiftGroups = useMemo(() => {
    const map = {};
    for (const s of upcoming) {
      const key = s.date + "|" + s.time;
      if (!map[key]) map[key] = { key, date: s.date, time: s.time, items: [] };
      map[key].items.push(s);
    }
    for (const g of Object.values(map)) {
      g.items.sort((a, b) => lastNameOf(a.volunteerName).localeCompare(lastNameOf(b.volunteerName)) || (a.volunteerName || "").localeCompare(b.volunteerName || ""));
    }
    return Object.values(map).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  }, [upcoming]);

  const dateGroups = useMemo(() => {
    const map = {};
    for (const g of shiftGroups) {
      if (!map[g.date]) map[g.date] = [];
      map[g.date].push(g);
    }
    return Object.entries(map)
      .sort(([a], [b]) => a.localeCompare(b))
      .map(([date, shifts]) => ({ date, shifts }));
  }, [shiftGroups]);

  // Drop selections for shifts that are no longer in view
  useEffect(() => {
    const validKeys = new Set(shiftGroups.map(g => g.key));
    setSelectedKeys(prev => {
      const next = new Set([...prev].filter(k => validKeys.has(k)));
      return next.size === prev.size ? prev : next;
    });
  }, [shiftGroups]);

  function toggleShift(key) {
    setSelectedKeys(prev => {
      const next = new Set(prev);
      next.has(key) ? next.delete(key) : next.add(key);
      return next;
    });
  }

  function selectAll() {
    setSelectedKeys(new Set(shiftGroups.map(g => g.key)));
  }
  function clearSelection() {
    setSelectedKeys(new Set());
  }

  const selectedPeople = useMemo(
    () => shiftGroups.filter(g => selectedKeys.has(g.key)).flatMap(g => g.items),
    [shiftGroups, selectedKeys]
  );
  const withPhones = selectedPeople.filter(s => s.phone);
  const withEmails = selectedPeople.filter(s => s.email);
  const pendingEmailCount = selectedPeople.filter(s => s.email && !s.reminderSentAt).length;

  async function copyAllNumbers() {
    const nums = withPhones.map(s => s.phone).join(", ");
    const ok = await copyToClipboard(nums);
    showToast(ok ? `Copied ${withPhones.length} number(s)` : "Couldn't copy — select manually", ok ? "good" : "bad");
  }

  async function copyAllEmails() {
    const emails = withEmails.map(s => s.email).join(", ");
    const ok = await copyToClipboard(emails);
    showToast(ok ? `Copied ${withEmails.length} email(s)` : "Couldn't copy — select manually", ok ? "good" : "bad");
  }

  async function copyMessages() {
    const selectedGroups = shiftGroups.filter(g => selectedKeys.has(g.key));
    if (selectedGroups.length === 0) {
      showToast("Nothing selected", "bad");
      return;
    }
    const lines = selectedGroups.map(g => `• ${fmtDate(g.date)}${g.time ? ` at ${fmtTime(g.time)}` : " (All day)"}`);
    const msg = selectedGroups.length === 1
      ? `Hi! Just a reminder you're scheduled to volunteer on ${fmtDate(selectedGroups[0].date)}${selectedGroups[0].time ? ` at ${fmtTime(selectedGroups[0].time)}` : " (all day)"}.\n\nThanks for serving with us!`
      : `Hi! Just a reminder you're scheduled to volunteer:\n${lines.join("\n")}\n\nThanks for serving with us!`;
    const ok = await copyToClipboard(msg);
    showToast(ok ? "Message copied" : "Couldn't copy", ok ? "good" : "bad");
  }

  async function sendEmails() {
    const toSend = selectedPeople.filter(s => s.email && !s.reminderSentAt);
    if (toSend.length === 0) {
      showToast("No emails to send", "bad");
      return;
    }
    setSending(true);
    try {
      const res = await fetch("/send-reminders", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          ministryKey,
          reminders: toSend.map(s => ({
            slotId: s.id, email: s.email, volunteerName: s.volunteerName,
            date: s.date, time: s.time, role: s.role,
          })),
        }),
      });
      const data = await res.json();
      const nextStatus = {};
      for (const r of data.results || []) {
        nextStatus[r.slotId] = r.ok ? "sent" : "error";
        if (r.ok) {
          await updateDoc(doc(db, slotsCollectionName, r.slotId), { reminderSentAt: new Date().toISOString() });
        }
      }
      setEmailStatus(prev => ({ ...prev, ...nextStatus }));
      const sentCount = Object.values(nextStatus).filter(v => v === "sent").length;
      showToast(`Sent ${sentCount}/${toSend.length} email(s)`, sentCount === toSend.length ? "good" : "bad");
    } catch (e) {
      showToast("Send failed — check the function is deployed", "bad");
    } finally {
      setSending(false);
    }
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      {shiftGroups.length === 0 && <Empty text="No upcoming assigned shifts." />}

      {shiftGroups.length > 0 && (
        <div style={{ display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap" }}>
          <div style={{ display: "flex", gap: 10 }}>
            <button onClick={selectAll} style={{ background: "none", border: "none", color: "var(--accent)", fontSize: 15, fontWeight: 600, padding: 0 }}>Select all</button>
            <button onClick={clearSelection} style={{ background: "none", border: "none", color: "var(--muted)", fontSize: 15, fontWeight: 600, padding: 0 }}>Clear</button>
          </div>
          <div style={{ fontSize: 14, color: "var(--muted)" }}>
            {selectedKeys.size === 0 ? "Nothing selected" : `${selectedKeys.size} shift${selectedKeys.size > 1 ? "s" : ""} selected · ${selectedPeople.length} ${selectedPeople.length === 1 ? "person" : "people"}`}
          </div>
        </div>
      )}

      {shiftGroups.length > 0 && (
        <div style={{
          position: "sticky", top: 0, zIndex: 5, display: "flex", gap: 8, flexWrap: "wrap",
          background: "var(--bg)", padding: "8px 0",
        }}>
          <Button onClick={copyAllNumbers} disabled={withPhones.length === 0}>
            Copy {withPhones.length || ""} number{withPhones.length === 1 ? "" : "s"}
          </Button>
          <Button onClick={copyAllEmails} disabled={withEmails.length === 0}>
            Copy {withEmails.length || ""} email{withEmails.length === 1 ? "" : "s"}
          </Button>
          <Button onClick={copyMessages} disabled={selectedKeys.size === 0}>
            Copy message
          </Button>
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 28 }}>
        {dateGroups.map(({ date, shifts }) => (
          <div key={date}>
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 14 }}>
              <div className="stub-font" style={{ fontSize: 20, color: "var(--text)", fontWeight: 700, whiteSpace: "nowrap" }}>
                {fmtDate(date)}
              </div>
              <div style={{ flex: 1, height: 1, background: "var(--border)" }} />
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              {shifts.map(g => {
                const isSelected = selectedKeys.has(g.key);
                return (
                  <div
                    key={g.key}
                    style={{
                      background: "var(--panel)", border: `1px solid ${isSelected ? "var(--accent)" : "var(--border)"}`,
                      borderRadius: 12, overflow: "hidden",
                    }}
                  >
                    <div
                      onClick={() => toggleShift(g.key)}
                      style={{
                        display: "flex", alignItems: "center", gap: 12, padding: "12px 14px",
                        background: isSelected ? "var(--accent-dim)" : "var(--panel-2)",
                        cursor: "pointer", touchAction: "manipulation", WebkitTapHighlightColor: "transparent", userSelect: "none",
                      }}
                    >
                      <div style={{
                        width: 22, height: 22, borderRadius: 5, flexShrink: 0,
                        border: `2px solid ${isSelected ? "var(--accent)" : "var(--border)"}`,
                        background: isSelected ? "var(--accent)" : "transparent",
                        display: "flex", alignItems: "center", justifyContent: "center",
                      }}>
                        {isSelected && <span style={{ color: "#1c1d21", fontSize: 14, fontWeight: 700, lineHeight: 1 }}>✓</span>}
                      </div>
                      <div className="stub-font" style={{ fontSize: 17, color: "var(--accent)", fontWeight: 700 }}>
                        {g.time ? fmtTime(g.time) : "All day"}
                      </div>
                      <div style={{ marginLeft: "auto", fontSize: 14, color: "var(--muted)" }}>
                        {g.items.length} {g.items.length === 1 ? "person" : "people"}
                      </div>
                    </div>

                    <div style={{ display: "flex", flexDirection: "column" }}>
                      {g.items.map(s => {
                        const status = s.reminderSentAt ? "sent" : emailStatus[s.id];
                        return (
                          <div key={s.id} style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center", padding: "10px 14px", borderTop: "1px solid var(--border)" }}>
                            <div style={{ minWidth: 140 }}>
                              <div style={{ fontWeight: 600, fontSize: 17 }}>{s.volunteerName}</div>
                              {s.role && <div style={{ fontSize: 14, color: "var(--muted)" }}>{s.role}</div>}
                            </div>
                            <div style={{ fontSize: 14, color: "var(--muted)", flex: 1, minWidth: 100 }}>
                              {s.phone || <span style={{ color: "var(--bad)" }}>no phone</span>}
                              {s.email ? ` · ${s.email}` : <span style={{ color: "var(--bad)" }}> · no email</span>}
                            </div>
                            {status === "sent" && <span style={{ fontSize: 14, color: "var(--good)" }}>✓ emailed</span>}
                            {status === "error" && <span style={{ fontSize: 14, color: "var(--bad)" }}>✗ failed</span>}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
